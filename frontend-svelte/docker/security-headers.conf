# Included in every location: nginx does not inherit add_header into a location that sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# The app loads only its own files. The two extra sources are M-Lab's NDT7 test: its locate service and its test servers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self' https://locate.measurementlab.net wss://*.measurement-lab.org; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
