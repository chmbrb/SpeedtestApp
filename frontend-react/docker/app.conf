# The app itself: included by both listeners in default.conf.
server_name _;
server_tokens off;
root /usr/share/nginx/html;
index index.html;

# The stock MIME table has no entry for the web app manifest.
types {
    application/manifest+json webmanifest;
}
include /etc/nginx/mime.types;

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# The API, including the live test progress stream (server-sent events), which must not be buffered or cut short.
location ^~ /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwritten, never appended to: a visitor must not be able to claim another address by sending this header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 128k;
    include /etc/nginx/security-headers.conf;
}

# Built files have content-hashed names: cache them for good. A missing one is a 404, never the app's HTML page.
location ^~ /assets/ {
    try_files $uri =404;
    # No "always": this header is only added to successful responses, so a 404 for a missing file is never cached.
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
}

location ~* \.(?:js|css|png|svg|ico|webmanifest|woff2?|json|txt|map)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;   # the service worker and manifest must always be revalidated
    include /etc/nginx/security-headers.conf;
}

# Everything else is the single-page app.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
}
